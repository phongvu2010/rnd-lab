services:
  backend:
    build: .
    container_name: rnd_fastapi
    restart: unless-stopped
    ports:
      - 8000:8000
    volumes:
      - ./app:/src/app               # Mount code để Live Reload trong lúc dev
    networks:
      - rnd_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


networks:
  rnd_network:
    name: rnd_network_bridge
    driver: bridge
